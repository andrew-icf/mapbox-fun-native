appId: com.andrewvandermeer.mapboxfunnative
tags:
  - smoke
---
- launchApp
- tapOn:
    id: "tab-map"
- tapOn: "Clear"
- assertVisible: "0.00 miles of lines"
- tapOn: "Line"
- tapOn:
    point: "20%,45%"
- tapOn:
    point: "30%,25%"
- assertVisible: 'Tap to add points \(2 so far\)\..*'
- tapOn:
    id: "finish-button"
- assertNotVisible: "0.00 miles of lines"