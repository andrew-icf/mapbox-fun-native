appId: com.andrewvandermeer.mapboxfunnative
tags:
  - smoke
---
- launchApp
- tapOn:
    id: "tab-map"
- tapOn: "Clear"
- assertVisible: "0.00 sq miles"
- tapOn: "Polygon"
- tapOn:
    id: "color-swatch-ef4444"
- assertVisible: '.*Saves in red.*'
- tapOn:
    point: "40%,45%"
- tapOn:
    point: "50%,45%"
- tapOn:
    point: "50%,55%"
- assertVisible: 'Tap to add points \(3 so far\)\..*'
- tapOn: "Finish"
- assertNotVisible: "0.00 sq miles"
